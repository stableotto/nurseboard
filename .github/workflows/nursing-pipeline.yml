name: Nursing Job Pipeline

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: false
        default: "full"
        type: choice
        options:
          - full
          - quick

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore SQLite cache
        uses: actions/cache@v4
        with:
          path: data/nursing_jobs.db
          key: nursing-db-${{ github.run_number }}
          restore-keys: nursing-db-

      - name: Run full pipeline
        if: ${{ github.event_name == 'schedule' || inputs.mode != 'quick' }}
        env:
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
        run: python -m pipeline.main

      - name: Quick export (skip scraping/enrichment)
        if: ${{ inputs.mode == 'quick' }}
        run: |
          python -c "
          import logging
          logging.basicConfig(level=logging.INFO, format='%(asctime)s [%(levelname)s] %(name)s: %(message)s', datefmt='%H:%M:%S')
          from pipeline.config import DB_PATH
          from pipeline.db import get_connection, get_exportable_jobs, get_stats
          from pipeline.export import export_for_frontend
          conn = get_connection(DB_PATH)
          exportable = get_exportable_jobs(conn)
          stats = get_stats(conn)
          export_for_frontend(exportable, stats)
          conn.close()
          print(f'Exported {len(exportable)} jobs')
          "

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend --project-name=scrubshifts --commit-dirty=true

      - name: Notify Google Indexing API
        if: always()
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python -m pipeline.google_indexing frontend/sitemap-pages.xml frontend/sitemap-jobs-*.xml || true

      - name: Notify IndexNow (Bing and others)
        if: success()
        run: python -m pipeline.indexnow --with-pages frontend/sitemap-pages.xml frontend/sitemap-jobs-*.xml || true

      # A failed run means the site stops updating. Open (or comment on) one
      # issue so the failure is visible instead of silent.
      - name: Report failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create pipeline-failure --color B60205 --description "Scheduled pipeline run failed" --force
          open=$(gh issue list --label pipeline-failure --state open --json number --jq '.[0].number')
          msg="Scheduled run of **Nursing Job Pipeline** failed: $RUN_URL"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$msg"
          else
            gh issue create --title "Nursing Job Pipeline is failing" --label pipeline-failure --body "$msg

          Jobs on scrubshifts.com stop updating while this fails. Close this issue once a run succeeds."
          fi
