name = "scrubshifts"
compatibility_date = "2024-09-25"
pages_build_output_dir = "frontend"

# Agent/API/MCP usage counts written by frontend/_agent.js (recordMetric).
# Bindings for this Pages project are defined here, not in the dashboard.
[[analytics_engine_datasets]]
binding = "AGENT_METRICS"
dataset = "scrubshifts_agent_traffic"

# Alert signups ("list") and saved-search webhooks ("webhook:<id>", "state:<id>").
# Created by .github/workflows/cloudflare-setup.yml.
[[kv_namespaces]]
binding = "SUBSCRIBERS"
